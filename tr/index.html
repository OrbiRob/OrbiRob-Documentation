<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbiRob Kullanım Kılavuzu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #212529;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Üst Siyah Header */
    header.tb-header {
      height: 60px;
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #222222;
    }
    .tb-header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }
    .tb-header .brand img {
      height: 32px;
      width: auto;
    }
    .tb-header .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .tb-header .brand-title { font-size: 1.1rem; color: #fff; }
    .tb-header .brand-subtitle { font-size: 0.7rem; color: #a0aec0; letter-spacing: 0.5px; }
    .tb-header .nav-links a {
      color: #cbd5e0;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
    }
    .tb-header .nav-links a:hover { color: #ffffff; }

    /* Layout Kapsayıcı */
    .tb-container {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 60px);
    }

    /* Sol Koyu Sidebar */
    aside.tb-sidebar {
      width: 300px;
      min-width: 300px;
      background-color: #1a1d20;
      color: #e2e8f0;
      padding: 25px 20px;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      overflow-y: auto;
      border-right: 1px solid #2d3748;
    }
    aside.tb-sidebar h2, aside.tb-sidebar .ltx_title_toc {
      font-size: 0.8rem !important;
      text-transform: uppercase;
      color: #e2e8f0 !important;
      letter-spacing: 1px;
      margin-bottom: 15px;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 8px;
    }
    aside.tb-sidebar ul {
      list-style: none !important;
      padding-left: 0 !important;
    }
    aside.tb-sidebar li {
      margin-bottom: 8px;
    }
    aside.tb-sidebar a {
      color: #a0aec0 !important;
      text-decoration: none !important;
      font-size: 0.9rem;
      display: block;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    aside.tb-sidebar a:hover {
      color: #ffffff !important;
      background-color: #2d3748;
    }

    /* Sağ Beyaz İçerik Alanı */
    main.tb-content {
      flex: 1;
      background-color: #ffffff;
      padding: 50px 80px;
      max-width: 1000px;
      overflow-y: auto;
    }

    /* LaTeXML Bozucu Stillerini Ezme */
    main.tb-content table { width: auto !important; margin: 0 !important; display: block !important; }
    main.tb-content td, main.tb-content th { writing-mode: horizontal-tb !important; width: auto !important; }
    main.tb-content .ltx_page_main, main.tb-content .ltx_document { display: block !important; width: 100% !important; }
    main.tb-content img { max-width: 100%; height: auto; display: block; margin: 20px 0; }
    main.tb-content h1, main.tb-content h2 { border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px; color: #1a202c; }
    
    @media (max-width: 850px) {
      .tb-container { flex-direction: column; }
      aside.tb-sidebar { width: 100%; height: auto; position: static; }
      main.tb-content { padding: 20px; }
    }
  </style>
</head>
<body>

  <header class="tb-header">
    <a href="../" class="brand">
      <img src="../assets/logo.png" onerror="this.src='../assets/logo.svg'; this.onerror=null;" alt="OrbiRob Logo">
      <div class="brand-text">
        <span class="brand-title">OrbiRob</span>
        <span class="brand-subtitle">SONA ROBOTICS</span>
      </div>
    </a>
    <nav class="nav-links">
      <a href="../">Ana Sayfa</a>
      <a href="./">TR</a>
      <a href="https://github.com/OrbiRob/OrbiRob-Documentation" target="_blank">GitHub</a>
    </nav>
  </header>

  <div class="tb-container">
    <aside class="tb-sidebar">
      <nav class="tb-sidebar"><nav>
<a href="../">Ana Sayfa</a>
<a href="./">Kullanım Kılavuzu (TR)</a>
<a href="https://github.com/OrbiRob/OrbiRob-Documentation" target="_blank">GitHub Repo</a>
</nav></nav>
    </aside>
    <main class="tb-content">
      <header class="tb-header">
<a class="brand" href="../">
<img alt="OrbiRob Logo" class="brand-logo" onerror="this.src='../assets/logo.svg'; this.onerror=null;" src="../assets/logo.png"/>
<div class="brand-title">
<span>OrbiRob</span>
<span class="brand-subtitle">SONA ROBOTICS</span>
</div>
</a>
<div class="nav-links">
<a href="../">Ana Sayfa</a>
<a href="./">TR</a>
<a href="https://github.com/OrbiRob/OrbiRob-Documentation" target="_blank">GitHub</a>
</div>
</header><div class="tb-wrapper"><main class="tb-content"><div class="docs-wrapper"><div class="docs-sidebar"></div><div class="docs-content">
<header>
<div class="logo">OrbiRob Documentation</div>
</header>
<div class="docs-container">
<main class="content-area">
<!-- Directly includes the LaTeXML generated HTML body -->
<iframe class="content-frame" onload="this.style.height=this.contentWindow.document.body.scrollHeight+'px';" src="main.html"></iframe>
</main>
</div>
</div></div></main></div>
    </main>
  </div>

</body>
</html>
